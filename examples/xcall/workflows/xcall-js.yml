name: XCall JS Ping-Pong
description: Cross-context ping/pong using the JavaScript SDK example.

force_pull_image: true

nodes:
  chain_id: testnet-1
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: js-xcall

steps:
  - name: Install app on Node 1
    type: install_application
    node: js-xcall-1
    path: examples/xcall/build/service.wasm
    dev: true
    outputs:
      app_id_node1: applicationId

  - name: Install app on Node 2
    type: install_application
    node: js-xcall-2
    path: examples/xcall/build/service.wasm
    dev: true

  - name: Create Namespace
    type: create_namespace
    node: js-xcall-1
    application_id: "{{app_id_node1}}"
    outputs:
      namespace_id: namespaceId

  - name: Create Context A
    type: create_context
    node: js-xcall-1
    application_id: "{{app_id_node1}}"
    group_id: "{{namespace_id}}"
    outputs:
      context_a_id: contextId
      context_a_member_key: memberPublicKey

  - name: Create Context B
    type: create_context
    node: js-xcall-1
    application_id: "{{app_id_node1}}"
    group_id: "{{namespace_id}}"
    outputs:
      context_b_id: contextId
      context_b_member_key: memberPublicKey

  - name: Invite Node 2 to namespace
    type: create_namespace_invitation
    node: js-xcall-1
    namespace_id: "{{namespace_id}}"
    outputs:
      namespace_invitation: invitation

  - name: Wait for namespace governance to gossip
    type: wait
    seconds: 5

  - name: Node 2 joins namespace
    type: join_namespace
    node: js-xcall-2
    namespace_id: "{{namespace_id}}"
    invitation: "{{namespace_invitation}}"

  - name: Join Context A from Node 2
    type: join_context
    node: js-xcall-2
    context_id: "{{context_a_id}}"
    outputs:
      identity_a: memberPublicKey

  - name: Join Context B from Node 2
    type: join_context
    node: js-xcall-2
    context_id: "{{context_b_id}}"
    outputs:
      identity_b: memberPublicKey

  - name: Wait for memberships to propagate
    type: wait
    seconds: 5

  - name: Check initial counter on context A
    type: call
    node: js-xcall-1
    context_id: "{{context_a_id}}"
    executor_public_key: "{{context_a_member_key}}"
    method: getCounter
    outputs:
      context_a_initial: result

  - name: Check initial counter on context B
    type: call
    node: js-xcall-1
    context_id: "{{context_b_id}}"
    executor_public_key: "{{context_b_member_key}}"
    method: getCounter
    outputs:
      context_b_initial: result

  - name: Assert counters start at zero
    type: json_assert
    statements:
      - "json_equal({{context_a_initial}}, {\"output\": 0})"
      - "json_equal({{context_b_initial}}, {\"output\": 0})"

  - name: Check initial counter on context B (node 2)
    type: call
    node: js-xcall-2
    context_id: "{{context_b_id}}"
    executor_public_key: "{{identity_b}}"
    method: getCounter
    outputs:
      context_b_initial_node2: result

  - name: Assert Node 2 counter starts at zero
    type: json_assert
    statements:
      - "json_equal({{context_b_initial_node2}}, {\"output\": 0})"

  - name: Send ping from Context A to Context B
    type: call
    node: js-xcall-1
    context_id: "{{context_a_id}}"
    executor_public_key: "{{context_a_member_key}}"
    method: ping
    args:
      targetContext: "{{context_b_id}}"

  - name: Wait for xcall execution
    type: wait
    seconds: 5

  - name: Verify Context B counter incremented
    type: call
    node: js-xcall-1
    context_id: "{{context_b_id}}"
    executor_public_key: "{{context_b_member_key}}"
    method: getCounter
    outputs:
      context_b_after_ping_node1: result

  - name: Assert Context B counter is 1 on Node 1
    type: json_assert
    statements:
      - "json_equal({{context_b_after_ping_node1}}, {\"output\": 1})"

  - name: Send ping from Context B to Context A
    type: call
    node: js-xcall-1
    context_id: "{{context_b_id}}"
    executor_public_key: "{{context_b_member_key}}"
    method: ping
    args:
      targetContext: "{{context_a_id}}"

  - name: Wait for second xcall execution
    type: wait
    seconds: 5

  - name: Verify Context A counter incremented
    type: call
    node: js-xcall-1
    context_id: "{{context_a_id}}"
    executor_public_key: "{{context_a_member_key}}"
    method: getCounter
    outputs:
      context_a_after_ping: result

  - name: Assert Context A counter is 1
    type: json_assert
    statements:
      - "json_equal({{context_a_after_ping}}, {\"output\": 1})"

stop_all_nodes: false
restart: true
wait_timeout: 120

