name: Release and Publish

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    # Publishing waits for the environment's required reviewers.
    environment: npm
    permissions:
      contents: write # Required to create releases and tags
      id-token: write # Required for OIDC/trusted publishers
      issues: write # Required for semantic-release failure issues

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Required for semantic-release@25.0.1 and project engines requirement
          registry-url: 'https://registry.npmjs.org'
          scope: '@calimero-network'
          token: false # Disable NPM_AUTH_TOKEN to allow OIDC trusted publishing

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      # No lifecycle scripts in the job that can mint an npm token; build and publish need none.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build

      - name: Publish @calimero-network/calimero-sdk-js to npm
        run: |
          cd packages/sdk
          echo "🚀 SDK Release"
          echo "📦 Package: @calimero-network/calimero-sdk-js"
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Publish @calimero-network/calimero-cli-js to npm
        run: |
          cd packages/cli
          echo "🚀 CLI Release"
          echo "📦 Package: @calimero-network/calimero-cli-js"
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
